                referenceId:
                  type: integer
                  nullable: true
                items:
                  type: array
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId:
                        type: integer
                      variantId:
                        type: integer
                        nullable: true
                      quantity:
                        type: number
                      unitCost:
                        type: number
                      batchCode:
                        type: string
                        nullable: true
                      expiryDate:
                        type: string
                        format: date
                        nullable: true
                notes:
                  type: string
      responses:
        "201":
          description: Phiếu đã tạo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

