    post:
      tags: [Customers]
      summary: Thêm khách hàng
      security:
        - BearerAuth: []
        - OAuth2: ["customers:write"]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
