        - $ref: "#/components/parameters/ToDateParam"
      responses:
        "200":
          description: Dữ liệu dashboard (< 2 giây với Redis cache 5 phút)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /reports/revenue:
    get:
      tags: [Reports]
      summary: Báo cáo doanh thu
      security:
        - BearerAuth: []
        - OAuth2: ["reports:read"]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/FromDateParam"
        - $ref: "#/components/parameters/ToDateParam"
        - $ref: "#/components/parameters/BranchIdParam"
        - in: query
          name: groupBy
          schema:
            type: string
            enum: [day, week, month, year]
            default: day
      responses:
        "200":
          description: Báo cáo doanh thu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ───────────── WEBHOOKS (outbound) ─────────────
  /webhooks:
    get:
      tags: [Settings]
      summary: Danh sách webhook endpoints đã cấu hình
      security:
        - BearerAuth: []
        - OAuth2: ["webhooks:write"]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Danh sách webhooks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    post:
      tags: [Settings]
      summary: Đăng ký webhook endpoint mới
      description: |
        BizOne sẽ gửi HTTP POST đến URL này khi có sự kiện.
        Signature xác thực: `X-BizOne-Signature: HMAC-SHA256(secret, body)`.

        **Các sự kiện hỗ trợ:**
        - `invoice.created`, `invoice.paid`, `invoice.refunded`
        - `order.created`, `order.status_changed`, `order.cancelled`
        - `inventory.low_stock`, `inventory.updated`
        - `customer.created`, `customer.updated`
      security:
        - BearerAuth: []
        - OAuth2: ["webhooks:write"]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  format: uri
                  example: "https://partner-app.vn/webhooks/bizone"
                events:
                  type: array
                  items:
                    type: string
                  example: ["invoice.created", "order.status_changed"]
                secret:
                  type: string
                  description: Secret để verify HMAC-SHA256 signature
                active:
                  type: boolean
                  default: true
      responses:
        "201":
          description: Webhook đã đăng ký
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

# ─────────────────────────────────────────────────────────────
# COMMON RESPONSES
# ─────────────────────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Token không hợp lệ hoặc hết hạn
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: "Token hết hạn hoặc không hợp lệ"

    Forbidden:
      description: Không có quyền thực hiện hành động này
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource không tồn tại
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: NOT_FOUND
              message: "Resource không tồn tại"

    RateLimited:
      description: Vượt quá giới hạn request
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

