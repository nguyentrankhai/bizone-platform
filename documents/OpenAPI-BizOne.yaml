            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: File Excel (.xlsx), tối đa 50MB
                updateExisting:
                  type: boolean
                  default: false
                  description: Cập nhật sản phẩm đã tồn tại nếu trùng SKU
      responses:
        "200":
          description: Kết quả import (1000 SP trong < 30 giây)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total:
                            type: integer
                          imported:
                            type: integer
                          updated:
                            type: integer
                          errors:
                            type: array
                            items:
                              type: object
                              properties:
                                row:
                                  type: integer
                                field:
                                  type: string
                                message:
                                  type: string

  /products/{id}:
