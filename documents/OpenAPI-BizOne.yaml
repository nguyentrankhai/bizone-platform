        - BearerAuth: []
        - OAuth2: ["inventory:write"]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionTypeId, warehouseId, items]
              properties:
                transactionTypeId:
                  type: integer
                  description: "1=nhập kho, 2=xuất kho, 3=điều chỉnh"
                warehouseId:
                  type: integer
                referenceType:
                  type: string
                  enum: [purchase_order, invoice, adjustment, transfer]
