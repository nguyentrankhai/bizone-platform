      security:
        - BearerAuth: []
        - OAuth2: ["orders:read"]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
