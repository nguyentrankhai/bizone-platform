          schema:
            type: string
          description: Từ khóa tìm kiếm (tên, SKU, barcode)
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 10
            maximum: 20
        - in: query
          name: includeInactive
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Kết quả tìm kiếm (< 300ms)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /products/import:
    post:
      tags: [Products]
      summary: Import sản phẩm từ file Excel
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
