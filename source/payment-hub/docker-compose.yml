name: bizone-payhub

x-app-env: &app-env
  DATABASE_URL: mysql://root:${DB_PASSWORD:?set DB_PASSWORD — docker compose --env-file ../../.env.development}@db:3306/paymentdb
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@cache:6379
  # Dispute evidence: the dev MinIO (`S3_ENDPOINT=http://localhost:9000` in .env.local) is not
  # reachable from a container → local volume unless S3_ENDPOINT is given for compose
  S3_ENDPOINT: ${COMPOSE_S3_ENDPOINT:-}

x-depends: &depends
  db:
    condition: service_healthy
  cache:
    condition: service_healthy

services:
  # QA-4 #128: apply Prisma migrations before the app starts (the runtime image has no Prisma CLI)
  migrate:
    build:
      context: .
      target: builder
    image: bizone-payhub-migrate
    container_name: payhub-migrate
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: mysql://root:${DB_PASSWORD:?set DB_PASSWORD — docker compose --env-file ../../.env.development}@db:3306/paymentdb
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    image: bizone-payhub
    container_name: payhub-app
    ports:
      - "${APP_PORT:-4000}:4000"
    env_file:
      - path: .env.local
        required: false
    environment:
      <<: *app-env
      # P7.5: /api/v1/health reports the age of the last backup of the "backup" service
      BACKUP_MONITOR: ${BACKUP_MONITOR:-true}
      HEALTH_TOKEN: ${HEALTH_TOKEN:-}
    depends_on:
      <<: *depends
      migrate:
        condition: service_completed_successfully
    volumes:
      - storage:/app/storage
    # readiness: 503 only when the database is unreachable (P7.5 — Redis / workers → degraded)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # P7.4: several worker instances share the BullMQ queues (one job → one worker; periodic jobs
  # run once per tick for the whole deployment). No container_name so it can be scaled:
  # WORKER_REPLICAS=3 or `docker compose up -d --scale worker=3`. WORKER_QUEUES picks the queues
  # of an instance (default all), WORKER_CONCURRENCY_<QUEUE> the parallel jobs per instance.
  worker:
    image: bizone-payhub
    pull_policy: never
    command: ["node", "dist/worker.mjs"]
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    env_file:
      - path: .env.local
        required: false
    environment:
      <<: *app-env
      HEARTBEAT_FILE: /tmp/payhub-worker.alive
    depends_on:
      <<: *depends
      app:
        condition: service_started
    # P7.5: the heartbeat file is touched every 10 s once Redis accepted the beat
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "process.exit(Date.now() - require('fs').statSync('/tmp/payhub-worker.alive').mtimeMs < 60000 ? 0 : 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  realtime:
    image: bizone-payhub
    pull_policy: never
    container_name: payhub-realtime
    command: ["node", "dist/server.mjs"]
    ports:
      - "${WS_HOST_PORT:-4001}:4001"
    env_file:
      - path: .env.local
        required: false
    environment: *app-env
    depends_on:
      <<: *depends
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # P7.5: daily backup (DB + stored files) at BACKUP_TIME (01:30 Asia/Ho_Chi_Minh), restore test
  # right after, 30-day retention, optional off-site copy (BACKUP_UPLOAD_CMD). Manual run:
  #   docker compose run --rm backup bash scripts/backup.sh
  #   docker compose run --rm backup bash scripts/backup-verify.sh latest
  #   docker compose run --rm backup bash scripts/restore.sh latest --target-db paymentdb --force --files
  backup:
    build:
      context: .
      target: ops
    image: bizone-payhub-ops
    container_name: payhub-backup
    env_file:
      - path: .env.local
        required: false
    environment:
      <<: *app-env
      BACKUP_DIR: /backups
      BACKUP_TIME: ${BACKUP_TIME:-01:30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      BACKUP_VERIFY: ${BACKUP_VERIFY:-true}
      BACKUP_UPLOAD_CMD: ${BACKUP_UPLOAD_CMD:-}
      BACKUP_ENCRYPTION_KEY_FILE: ${BACKUP_ENCRYPTION_KEY_FILE:-}
    volumes:
      - ${BACKUP_HOST_DIR:-backups}:/backups
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const t = Number(require('fs').readFileSync('/tmp/payhub-backup.alive', 'utf8')); process.exit(Date.now() / 1000 - t < 120 ? 0 : 1)",
        ]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # P7.5: uptime monitor (PagerDuty / e-mail on downtime). Opt-in — `--profile monitoring`; in
  # production run it on ANOTHER host (or an external uptime service on /api/v1/health).
  monitor:
    image: bizone-payhub
    pull_policy: never
    container_name: payhub-monitor
    profiles: ["monitoring"]
    command: ["node", "dist/monitor.mjs"]
    env_file:
      - path: .env.local
        required: false
    environment:
      MONITOR_TARGETS: ${MONITOR_TARGETS:-app=http://app:4000/api/v1/health,realtime=http://realtime:4001/health}
      MONITOR_STATE_FILE: /app/monitor/monitor-state.json
      HEALTH_TOKEN: ${HEALTH_TOKEN:-}
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY:-}
      PAGERDUTY_EVENTS_URL: ${PAGERDUTY_EVENTS_URL:-https://events.pagerduty.com/v2/enqueue}
      MONITOR_ALERT_EMAILS: ${MONITOR_ALERT_EMAILS:-}
      MONITOR_INTERVAL_S: ${MONITOR_INTERVAL_S:-30}
    ports:
      - "${MONITOR_HOST_PORT:-4002}:4002"
    volumes:
      - monitor-data:/app/monitor
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: payhub-db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD — docker compose --env-file ../../.env.development}
      MARIADB_DATABASE: paymentdb
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # Host port 3308: 3306 is the local MariaDB, 3307 is the BizOne Core stack
    ports:
      - "${DB_HOST_PORT:-3308}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    container_name: payhub-cache
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD} --appendonly yes
    # Host port 6381: 6379 is the local Redis, 6380 is the BizOne Core stack
    ports:
      - "${REDIS_HOST_PORT:-6381}:6379"
    volumes:
      - cache-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a ${REDIS_PASSWORD:?set REDIS_PASSWORD} --no-auth-warning ping | grep PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  cache-data:
  storage:
  backups:
  monitor-data:
