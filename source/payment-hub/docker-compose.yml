name: bizone-payhub

x-app-env: &app-env
  DATABASE_URL: mysql://root:${DB_PASSWORD:-mypass}@db:3306/paymentdb
  REDIS_URL: redis://:${REDIS_PASSWORD:-123456}@cache:6379

x-depends: &depends
  db:
    condition: service_healthy
  cache:
    condition: service_healthy

services:
  app:
    build: .
    image: bizone-payhub
    container_name: payhub-app
    ports:
      - "${APP_PORT:-4000}:4000"
    env_file:
      - path: .env.local
        required: false
    environment: *app-env
    depends_on: *depends
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  worker:
    image: bizone-payhub
    pull_policy: never
    container_name: payhub-worker
    command: ["node", "dist/worker.js"]
    env_file:
      - path: .env.local
        required: false
    environment: *app-env
    depends_on:
      <<: *depends
      app:
        condition: service_started
    restart: unless-stopped

  realtime:
    image: bizone-payhub
    pull_policy: never
    container_name: payhub-realtime
    command: ["node", "dist/server.js"]
    ports:
      - "${WS_HOST_PORT:-4001}:4001"
    env_file:
      - path: .env.local
        required: false
    environment: *app-env
    depends_on:
      <<: *depends
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: payhub-db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-mypass}
      MARIADB_DATABASE: paymentdb
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # Host port 3308: 3306 is the local MariaDB, 3307 is the BizOne Core stack
    ports:
      - "${DB_HOST_PORT:-3308}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    container_name: payhub-cache
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456} --appendonly yes
    # Host port 6381: 6379 is the local Redis, 6380 is the BizOne Core stack
    ports:
      - "${REDIS_HOST_PORT:-6381}:6379"
    volumes:
      - cache-data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-123456} --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  cache-data:
