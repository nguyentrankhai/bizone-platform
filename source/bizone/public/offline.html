<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />
    <title>Mất kết nối | BizOne</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
        font-family:
          Inter,
          -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      main {
        max-width: 360px;
        padding: 32px 24px;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0 0 24px;
        color: #475569;
        font-size: 15px;
        line-height: 1.5;
      }
      a,
      button {
        display: block;
        width: 100%;
        min-height: 44px;
        margin-top: 12px;
        border-radius: 10px;
        font: inherit;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        box-sizing: border-box;
        line-height: 44px;
        text-decoration: none;
      }
      button {
        border: 0;
        background: #2563eb;
        color: #fff;
      }
      a {
        border: 1px solid #cbd5e1;
        background: #fff;
        color: #1e293b;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="BizOne" />
      <h1>Không có kết nối mạng</h1>
      <p>
        Trang này chưa được lưu để xem ngoại tuyến. Bạn vẫn có thể xem số liệu tổng quan lần cập
        nhật gần nhất.
      </p>
      <button type="button" onclick="location.reload()">Thử lại</button>
      <a href="/mobile/dashboard">Xem tổng quan đã lưu</a>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
