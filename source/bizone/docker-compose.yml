name: bizone-core

services:
  app:
    build: .
    container_name: bizone-app
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: mysql://root:${DB_PASSWORD:-mypass}@db:3306/bizonedb
      REDIS_URL: redis://:${REDIS_PASSWORD:-123456}@cache:6379
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: bizone-db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-mypass}
      MARIADB_DATABASE: bizonedb
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # Host port 3307 avoids clashing with a MariaDB already running on 3306
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    container_name: bizone-cache
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456}
    # Host port 6380 avoids clashing with a Redis already running on 6379
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - cache-data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-123456} --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  cache-data:
