name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [bizone, payment-hub]
    defaults:
      run:
        working-directory: source/${{ matrix.app }}
    env:
      # Build/typecheck never connect to these — Prisma generate and next build only need them set.
      DATABASE_URL: mysql://ci:ci@localhost:3306/ci
      TENANT_DATABASES: tenant_demo=ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:jobs
