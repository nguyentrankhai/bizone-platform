version: "3.9"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.7
    container_name: bizone-keycloak
    command: start-dev --import-realm
    environment:
      # Admin credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: "Bizone@2026!"
      # Database (dùng MariaDB đang chạy)
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://host.docker.internal:3306/keycloakdb?characterEncoding=UTF-8&useUnicode=true
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: mypass
      KC_DB_SCHEMA: keycloakdb
      # Dev mode settings
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: INFO
      # Features
      KC_FEATURES: "token-exchange,admin-fine-grained-authz"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
